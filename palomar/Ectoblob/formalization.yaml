      general results, so the Solution imports it too. Finite Kingman coalescent and hierarchy
      modules were adapted from commit 06f684e5 under Apache-2.0 before that, in
      lean4-phylo-tree-of-blobs (lean4-phylo-tree-of-blobs/docs/ADAPTED_SOURCES.md,
      lean4-phylo-tree-of-blobs/docs/COALESCENT_SOURCES.md). The network coalescent on arbitrary
      networks was first written in lean4-phylo-tree-of-blobs and has moved to the library; the
      library's term-based level-1 network coalescent is not used.
  - id: "https://github.com/formal-phylogenetics/lean4-camus"
