version: "v0.4"

project:
  name: "ECToBlob: statistical inference of the tree of blobs from quartet concordance factors"
  description: >-
    A Lean 4 formalization of John A. Rhodes, Elizabeth S. Allman, Cécile Ané and Hector Baños
    (2026), "Statistical inference of the Tree of Blobs of a phylogenetic network from quartet
    concordance factors", bioRxiv 10.64898/2026.05.28.728501 v1. Its algorithm, ECToBlob, infers the
    tree of blobs of a phylogenetic network from gene trees under the network multispecies
    coalescent.


    Proved: optimal trees of the maximum quartet support criterion resolve the tree of blobs
    (Theorem 3.1); if every quartet across a quadripartition has the split as a cut-edge split then
    the network has that cut edge (Theorem 4.1); statistical consistency of the ECToBlob algorithm
    for all its variants, with sequences of levels independent of the network (Theorem 8.2); every
    other numbered result, and what the paper says in passing. Of the sources it cites, Theorem 1 of
    Legried et al. 2021 on quartets; what the proofs use of Allman et al. 2023, TINNiK and NANUQ is
    stated here and proved from their repositories, lean4-allman2023, lean4-tinnik and lean4-nanuq.


    The audit records E1-E17, E35-E38, E41 and E68 on the paper, including a counterexample to a
    boundary case of Theorem 8.2 and a gap in its proof that needed a new argument, and E80 and E84
    on the two sources above.


    No result of the literature is assumed. No person has reviewed the proofs.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

