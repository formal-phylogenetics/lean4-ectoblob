name = "ECToBlob"
version = "0.1.0"
keywords = ["math", "phylogenetics"]
description = "A Lean 4 formalization of ECToBlob (Rhodes, Allman, Ané, Baños 2026)"
defaultTargets = ["ECToBlob"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

# The root of the collection: the shared library of phylogenetics.
[[require]]
name = "Phylogenetics"
git = "https://github.com/vltanh/lean4-phylogenetics"
rev = "8c66a1354fc32f0e59ee22634916b154eebb54ee"

# The hub of the tree-of-blobs papers: what they share.
[[require]]
name = "TreeOfBlobs"
git = "https://github.com/vltanh/lean4-tob"
rev = "289439fa2a79279ca6cc9f3b1e39496602d93db1"

# Allman, Baños, Mitchell, Rhodes 2023, whose results this paper uses.
[[require]]
name = "AllmanEtAl2023"
git = "https://github.com/vltanh/lean4-allman2023"
rev = "3f2d0608ba389c2c858729a4bef0c514b57a0114"

# TINNiK (Allman, Baños, Mitchell, Rhodes 2024), whose results this paper uses.
[[require]]
name = "TINNiK"
git = "https://github.com/vltanh/lean4-tinnik"
rev = "4c07751536f46098470cd2962ce5a76f44e97ff5"

# NANUQ (Allman, Baños, Rhodes 2019), whose results this paper uses.
[[require]]
name = "Nanuq"
git = "https://github.com/vltanh/lean4-nanuq"
rev = "40e9928f438b76c296cc2638d31287a7cf864589"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc1"

# Every module of this repository is under ECToBlob/ (lean4-phylogenetics, docs/CONVENTIONS.md).
[[lean_lib]]
name = "ECToBlob"
globs = ["ECToBlob.+"]
