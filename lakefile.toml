name = "Ectoblob"
version = "0.1.0"
keywords = ["math", "phylogenetics"]
description = "A Lean 4 formalization of ECToBlob (Rhodes, Allman, Ané, Baños 2026)"
defaultTargets = ["Ectoblob", "Palomar"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

# The root of the collection: the shared library of phylogenetics.
[[require]]
name = "Phylogenetics"
git = "https://github.com/formal-phylogenetics/lean4-phylogenetics"
rev = "3fcabfd7d191990dda268b0b3968d945b65eb59a"

# The hub above this paper's: what the papers on network estimation share.
[[require]]
name = "PhyloNetwork"
git = "https://github.com/formal-phylogenetics/lean4-phylo-network"
rev = "4ed2bb0f7085acbf1326f43e2a5c582ba4566125"

# The hub of the tree-of-blobs papers: what only they share.
[[require]]
name = "TreeOfBlobs"
git = "https://github.com/formal-phylogenetics/lean4-phylo-tree-of-blobs"
rev = "265ba443cb147a33ff2478cbc311a5597db1c1c7"

# Allman, Baños, Mitchell, Rhodes 2023, whose results this paper uses.
[[require]]
name = "Allman2023"
git = "https://github.com/formal-phylogenetics/lean4-allman2023"
rev = "46efa61d0988df12649089689ae77bc100be034f"

# TINNiK (Allman, Baños, Mitchell, Rhodes 2024), whose results this paper uses.
[[require]]
name = "Tinnik"
git = "https://github.com/formal-phylogenetics/lean4-tinnik"
rev = "de514e1f14522531f16dcdfa12244fe72fe05944"

# NANUQ (Allman, Baños, Rhodes 2019), whose results this paper uses.
[[require]]
name = "Nanuq"
git = "https://github.com/formal-phylogenetics/lean4-nanuq"
rev = "edca11442dc8f45662b35a6a4d03073010bfea10"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

# Every module of the project is in Ectoblob/, but its Challenge and its Solution, which are in
# palomar/ (lean4-phylogenetics, docs/CONVENTIONS.md, Sections 2 and 3). Lake fails on a glob whose
# directory, or a root whose file, does not exist.

# The paper's library, in the namespace Ectoblob: general mathematics in Ectoblob/Basic/, the results
# the paper cites in Ectoblob/External/, the definitions of the Challenge in Ectoblob/Defs.lean, and
# the paper's sections.
[[lean_lib]]
name = "Ectoblob"
globs = ["Ectoblob.+"]

# The paper's Challenge and Solution, the modules Ectoblob.Challenge and Ectoblob.Solution of the
# source directory palomar/ (Comparator: palomar/Ectoblob/comparator.json). Declared last: Lake gives
# a module to the last library whose patterns match it, and the glob above matches these names when
# the paper's name is the root.
[[lean_lib]]
name = "Palomar"
srcDir = "palomar"
roots = ["Ectoblob.Challenge", "Ectoblob.Solution"]
